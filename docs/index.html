  <script>try{var t=localStorage.getItem('claw-docs-theme');if(t)document.documentElement.setAttribute('data-md-color-scheme',t);else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-md-color-scheme','slate')}catch(e){}</script>
</head>
<body data-base="./" data-page="home">
  <header id="site-header" class="md-header"></header>
  <div class="md-mask" id="site-mask"></div>
  <div class="md-main">
    <div class="md-grid">
      <aside id="site-sidebar" class="md-sidebar md-sidebar--primary"></aside>
      <main class="md-content">
        <article class="md-content__inner md-typeset">
          <div class="po-spec">
            <h1>8 行规格</h1>
            <div class="po-spec-actions">
              <button type="button" id="copy-spec" class="md-button md-button--primary">复制 8 行</button>
              <span id="copy-state" class="po-spec-state"></span>
            </div>
            <pre class="po-spec-code"><code id="spec-text">竖屏 9:16 一镜到底 全程无字幕 零硬切零转场零分镜切点
胶片颗粒天气晴朗 暖黄色光源从高处洒下 运动模糊中物体轻微抖动
手持动态追踪·纪实 微震动幅度 35mm 持续匀速平移
滑稽滑音 @ 0.0s 128dB
古旧青瓦屋顶 范富贵（青年男性，汉服）位于构图顶部三分线外 景别远景 仅主体和屋顶轮廓可见
范富贵站立→脚下打滑→身体姿态滑稽 速度中等 结束无环境破坏
首帧：范富贵凌空站立的滑稽剪影 尾帧：范富贵滑倒过程的持续晃动轨迹
负面提示词：瞳孔收缩 肌肉收紧 尘埃浮动</code></pre>
          </div>
        </article>
        <nav id="site-pager" class="md-footer-nav"></nav>
      </main>
      <aside id="site-toc" class="md-sidebar md-sidebar--secondary"></aside>

  </div>
  <button id="site-top" class="md-top" title="回到页面顶部" aria-label="回到顶部">↑</button>
  <script src="./assets/nav.js?v=8spec2"></script>
  <script src="./assets/site.js?v=8spec2"></script>
  <script>
    (function () {
      var btn = document.getElementById('copy-spec');
      var state = document.getElementById('copy-state');
      var text = document.getElementById('spec-text').textContent;
      btn.addEventListener('click', function () {
        function done() { state.textContent = '已复制'; setTimeout(function () { state.textContent = ''; }, 1600); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallback(); });
        } else { fallback(); }
        function fallback() {
          var ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch (e) {}
          document.body.removeChild(ta);
        }
      });
    })();
  </script>
</body>
</html>
